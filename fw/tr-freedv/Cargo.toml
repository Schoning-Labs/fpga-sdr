[package]
name = "tr-freedv"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-only"
description = "FreeDV 700D and 700E: OFDM modem, LDPC and framing around tr-codec2; a no_std Rust port of codec2's FreeDV code"

[dependencies]
tr-codec2 = { path = "../tr-codec2" }
libm = { version = "0.2.16", default-features = false }

[dev-dependencies]
hound = "3.5.1"
