[package]
edition = "2024"
rust-version = "1.93"
name = "mfsk-core"
version = "0.11.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure-Rust WSJT-family decoders + synthesisers (FT8 FT4 FST4 WSPR JT9 JT65 Q65) behind a zero-cost Protocol trait. Host (rustfft) or no_std embedded (ESP32-S3, RP2350, Cortex-M) via a pluggable FFT backend; fixed-point hot path for FPU-less MCUs. Ships with embedded-poc/m5stack-s3-app, a working M5StickS3 FT8 controller (LCD UI, BLE CI-V to IC-705, acoustic mic, QSO FSM) decoding real on-air signals in ~1.2 s post-SlotEnd on Xtensa LX7."
readme = "README.md"
keywords = [
    "wsjtx",
    "ft8",
    "wspr",
    "q65",
    "amateur-radio",
]
categories = [
    "science",
    "encoding",
    "multimedia::audio",
    "embedded",
    "no-std",
]
license = "GPL-3.0-or-later"
repository = "https://github.com/jl1nie/mfsk-core"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
alloc = []
default = [
    "std",
    "ft8",
    "ft4",
    "parallel",
    "fft-rustfft",
]
dotprod-extern = []
fft-extern = ["alloc"]
fft-rustfft = [
    "std",
    "dep:rustfft",
]
fixed-point = ["nstep-half"]
fixed-point-llr = ["fixed-point"]
fst4 = []
ft4 = []
ft8 = []
full = [
    "std",
    "fft-rustfft",
    "ft8",
    "ft4",
    "fst4",
    "wspr",
    "jt9",
    "jt65",
    "q65",
    "msk144",
    "packet-bytes",
    "uvpacket",
    "parallel",
    "serde",
]
hash-table-small = []
internal-testing = []
jt65 = ["fft-rustfft"]
jt9 = [
    "fft-rustfft",
    "dep:realfft",
]
msk144 = []
nstep-half = []
packet-bytes = []
parallel = [
    "std",
    "dep:rayon",
]
profile-coarse = ["std"]
q65 = ["fft-rustfft"]
serde = ["dep:serde"]
std = ["alloc"]
uvpacket = [
    "fst4",
    "std",
]
wspr = []
wspr-ddc = []
wspr-ddc-cascade = []
wspr-fano-cap-fast = []
wspr-pass2-topn = []

[lib]
name = "mfsk_core"
path = "src/lib.rs"


[dependencies.crc]
version = "3"
default-features = false

[dependencies.num-complex]
version = "0.4"
features = ["libm"]
default-features = false

[dependencies.num-traits]
version = "0.2"
features = ["libm"]
default-features = false

[dependencies.rayon]
version = "1"
optional = true

[dependencies.realfft]
version = "3.5.0"
optional = true
default-features = false

[dependencies.rustfft]
version = "6"
optional = true

[dependencies.serde]
version = "1"
features = [
    "derive",
    "alloc",
]
optional = true
default-features = false

[dev-dependencies.rustfft]
version = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies.rustfft]
version = "6"
features = ["wasm_simd"]
optional = true
