# DRAFT (see [block].status below): base address is fixed (docs/ARCHITECTURE.md 4.1), but the
# register layout is a first cut at section 3.7, not checked against any RTL yet.
# Whoever builds the audio engine should edit this file (and flip status to "final")
# once the engine's real register port exists.

[block]
name = "audio"
base = 0xE809_0000
size = 0x0001_0000
status = "draft"
description = """
Audio engine (docs/ARCHITECTURE.md 3.7): ring pointers for the 48 kHz stereo ring firmware
writes, PT8211 output volume, and low-water status. The ring's sample storage is in DDR3
(5.4); this block is pointers and control only.
"""

[[register]]
name = "id"
offset = 0x000
access = "RO"
reset = 0x4155_0001
description = "Block identifier/version: 'AU' + version 1 (set by the chip top level)."

[[register]]
name = "ctrl"
offset = 0x004
description = "Output enable."

[[register.field]]
name = "enable"
bits = "0"
access = "RW"
reset = 0
description = "1 = PT8211 and HDMI audio paths running from the ring."

[[register]]
# The chip's register block (rtl/top/block_regs.v, audio_regs) resets this register to 0, not to the value below; the firmware writes the ring address before it enables the audio engine. The value stays as a documented default because it generates constants.
name = "ring_base"
offset = 0x008
access = "RW"
reset = 0x1200_0000
description = "Ring base address in DDR3 (docs/ARCHITECTURE.md 5.4: within the 0x1200_0000 IQ/audio/TX ring region)."

[[register]]
name = "ring_size"
offset = 0x00C
access = "RW"
reset = 0
description = "Ring size in stereo sample frames (power of two)."

[[register]]
name = "ring_wptr"
offset = 0x010
access = "RW"
reset = 0
description = "Write pointer, in frames. Written by firmware after it writes back the new samples' cache lines (docs/ARCHITECTURE.md 4.2, CPU-written ring)."

[[register]]
name = "ring_rptr"
offset = 0x014
access = "RO"
reset = 0
description = "Read pointer, in frames. Updated by the fabric consumer; firmware reads it to know how much room remains before overrunning it."

[[register]]
# The chip's register block (rtl/top/block_regs.v, audio_regs) resets this register to 0 (silent), not to 128; the firmware writes the volume at start-up. The value stays as a documented default because it generates constants.
name = "volume"
offset = 0x018
access = "RW"
reset = 128
description = "Output volume, 0-255 linear (ARCHITECTURE 3.7: the PT8211 itself has no volume control)."

[[register]]
name = "status"
offset = 0x01C
description = "Sticky low-water flag, matching fabric interrupt line 3 (ARCHITECTURE 4.3)."

[[register.field]]
name = "low_water"
bits = "0"
access = "W1C"
reset = 0
description = "Set when the ring fill drops below the low-water mark; cleared by firmware writing 1 after refilling."

# ---- digital outputs (docs/AUDIO_OUT.md): S/PDIF and I2S on PMOD2, HDMI audio, test tone
[[register]]
name = "out_ctrl"
offset = 0x020
description = "Digital audio outputs (docs/AUDIO_OUT.md). They carry the engine's 48 kHz stream, zeros while the engine is off or its ring is empty."

[[register.field]]
name = "spdif"
bits = "0"
access = "RW"
reset = 1
description = "1 = S/PDIF output on PMOD2 pin 12 (B21) running; 0 = pin low."

[[register.field]]
name = "i2s"
bits = "1"
access = "RW"
reset = 1
description = "1 = I2S output on PMOD2 pins 9, 10, 7, 8 (bit clock, word clock, data, master clock) running; 0 = pins low."

[[register.field]]
name = "tone"
bits = "2"
access = "RW"
reset = 0
description = "1 = S/PDIF, I2S and HDMI audio carry a 1 kHz test tone (-4.3 dBFS, both channels) instead of the stream. Needs neither the engine nor DDR3. The PT8211 path is not affected."

[[register]]
name = "out_status"
offset = 0x024
description = "State of the digital outputs. The two counters wrap at 255."

[[register.field]]
name = "pll_lock"
bits = "0"
access = "RO"
reset = 0
description = "1 = the audio PLL (49.152 MHz) is locked."

[[register.field]]
name = "run"
bits = "1"
access = "RO"
reset = 0
description = "1 = S/PDIF and I2S are sending samples (their 8-sample buffer has filled); 0 = they send zeros."

[[register.field]]
name = "live"
bits = "2"
access = "RO"
reset = 0
description = "1 = the last 48 kHz sample came from the audio engine; 0 = the engine delivers nothing and zeros (or the tone) are sent at exactly 48 kHz."

[[register.field]]
name = "slips"
bits = "15:8"
access = "RO"
reset = 0
description = "Number of slips: one sample taken out or put in over 64 frames by blending, because the stream's 48 kHz and the audio PLL's differ (expected: one every 17 minutes)."

[[register.field]]
name = "errors"
bits = "23:16"
access = "RO"
reset = 0
description = "Number of buffer overruns or underruns between the stream and the audio clock (a sample lost or the reader restarted). Expected: 0."
